# G96 (Catalina Sky Survey, Mt. Lemmon 60") adapter + pipeline parameters
survey: g96
obscode: G96
band: G                      # unfiltered; CSS reports G-band-like
exptime_s: 30.0
pixscale_arcsec: 1.52
image_variety: arch          # arch.fz: high-pass filtered, valid WCS (per A. Heinze)
raw_variety: fits            # raw counts for saturation/variance
mjd_is_shutter_open: false   # RESOLVED 2026-07-19 (bin/infer_g96_timing.py): CSS's own
                             # MPC-submitted epochs for these exposures match the header
                             # MJD to +0.03s -> header MJD is already MID-exposure.

preprocess:
  sat_margin_adu: 2000       # mask raw >= SATURATE - margin
  sat_dilate_px: 5
  bleed_min_run_px: 10
  bright_star_frac: 0.97     # halos only for truly saturated stars
  halo_a_px: 6
  halo_b_px: 2.5             # multiplies sqrt(saturated-blob area/pi)
  edge_px: 16
  register_check_px: 0.5     # abort if WCS vs phase-corr disagree by more
  var_grid_px: 128           # empirical local-variance grid

detect:
  tile: 1024
  overlap: 128
  min_length: 8
  frt_threshold: 5.0
  mf_snr_min: 11.0          # FROZEN 2026-07 from negated-diff FP calibration: the
                           # negated (source-free) G96 diff yields symmetric-artifact
                           # FPs up to SNR 15.5 (5th-highest 11.2); mf_snr_min=11 ->
                           # ~5 FP/frame before the repetition/dipole cuts.
  # --- survey-scale performance (Phase 1, 2026-07; see PATCHES.md) ---
  fast_suppress: true      # geometric capsule instead of pyradon's 4x-oversampled
                           # full-tile model+convolve for streak blanking. Same
                           # footprint (validated: never under-masks), ~5.5x on
                           # the detect stage. false = stock pyradon, for A/B.
  fast: false              # true = SURVEY MODE: skip the per-candidate Veres LSQ
                           # (~917 ms each) and emit the FRT+MF rough trail with
                           # APPROXIMATE cross/along-track errors. Measured vs
                           # truth: PA 0.47 deg, length 1.9% -- well inside
                           # heliolinc's gates (siglenscale 0.5). Veres then runs
                           # as a POST-LINKING refinement on linked detections.

vet:
  len_min_arcsec: 6.0
  len_max_arcsec: 300.0
  chi2r_lo: 0.3
  chi2r_hi: 3.0
  sig_along_max_arcsec: 4.0
  edge_px: 30
  repeat_rad_arcsec: 5.0
  repeat_pa_deg: 10.0
