# G96 (Catalina Sky Survey, Mt. Lemmon 60") adapter + pipeline parameters
survey: g96
obscode: G96
band: G                      # unfiltered; CSS reports G-band-like
exptime_s: 30.0
pixscale_arcsec: 1.52
image_variety: arch          # arch.fz: high-pass filtered, valid WCS (per A. Heinze)
raw_variety: fits            # raw counts for saturation/variance
mjd_is_shutter_open: null    # UNKNOWN -> mid_mjd = MJD + exptime/2 assumed w/ warning;
                             # resolve empirically (Test v) then set true/false

preprocess:
  sat_margin_adu: 2000       # mask raw >= SATURATE - margin
  sat_dilate_px: 5
  bleed_min_run_px: 10
  bright_star_frac: 0.5      # mask halos for raw peaks > frac*SATURATE
  halo_a_px: 8
  halo_b_px: 12
  edge_px: 16
  register_check_px: 0.5     # abort if WCS vs phase-corr disagree by more
  var_grid_px: 128           # empirical local-variance grid

detect:
  tile: 1024
  overlap: 128
  min_length: 8
  frt_threshold: 5.0
  mf_snr_min: 6.0            # provisional; frozen after injection calibration (P4)

vet:
  len_min_arcsec: 6.0
  len_max_arcsec: 300.0
  chi2r_lo: 0.3
  chi2r_hi: 3.0
  sig_along_max_arcsec: 4.0
  edge_px: 30
  repeat_rad_arcsec: 5.0
  repeat_pa_deg: 10.0
